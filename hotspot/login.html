<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{COMPANY_NAME}} — Connect to Internet</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--brand:{{BRAND_COLOR}};--brand-dark:{{BRAND_DARK}}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 50%,var(--brand-dark) 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  background:rgb(34,34,33);
  border-radius:22px;
  box-shadow:14px 14px 28px rgb(10,10,9),-7px -7px 18px rgb(44,44,42),0 0 0 1px rgba(255,255,255,0.043);
  padding:40px 36px;
  width:100%;max-width:420px;
}
.icon-wrap{
  width:64px;height:64px;border-radius:16px;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:28px;
}
.icon-wrap svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{color:#e8e8e6;font-size:20px;font-weight:700;text-align:center;margin-bottom:6px}
.subtitle{color:rgba(255,255,255,0.50);font-size:13px;text-align:center;margin-bottom:28px}
.error-box{
  background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.30);
  color:#fca5a5;border-radius:10px;padding:12px 16px;font-size:13px;
  margin-bottom:20px;display:flex;align-items:center;gap:10px;
}
.error-box svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:#fca5a5;stroke-width:2}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,0.60);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.form-group input{
  width:100%;padding:13px 14px;
  background:rgb(27,27,26);
  box-shadow:inset 4px 4px 8px rgb(10,10,9),inset -2px -2px 5px rgb(42,42,40);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;color:#e8e8e6;font-size:14px;outline:none;
  transition:border-color .2s;
}
.form-group input:focus{border-color:var(--brand)}
.form-group input::placeholder{color:rgba(255,255,255,0.25)}
.btn-login{
  width:100%;padding:14px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 100%);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  transition:opacity .18s,transform .14s;margin-top:4px;
}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.btn-login:active{opacity:1;transform:translateY(0)}
.footer-links{display:flex;justify-content:center;gap:20px;margin-top:24px}
.footer-links a{color:rgba(255,255,255,0.40);font-size:12px;text-decoration:none;transition:color .18s}
.footer-links a:hover{color:rgba(255,255,255,0.70)}
.divider{height:1px;background:rgba(255,255,255,0.06);margin:20px 0}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <!-- Wifi icon -->
    <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="#fff"/></svg>
  </div>
  <h1>{{COMPANY_NAME}}</h1>
  <p class="subtitle">Sign in to access the internet</p>

  <!-- MikroTik error variable — only shown if login fails -->
  $(if error)
  <div class="error-box">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>$(error)</span>
  </div>
  $(endif)

  <form name="login" action="$(link-login-only)" method="post" accept-charset="UTF-8">
    <input type="hidden" name="dst" value="$(link-orig-esc)">
    <input type="hidden" name="popup" value="true">

    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" value="$(username)" placeholder="Enter your username" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login">Connect to Internet</button>
  </form>

  <div class="divider"></div>
  <div class="footer-links">
    <a href="$(link-orig)">Trial</a>
    <a href="status">My Status</a>
    <a href="$(link-logout)">Logout</a>
  </div>
</div>
</body>
</html>
