<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login — FortuNett Technologies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/auth.css?v=3">
    <script>
        // Apply tenant branding before paint to avoid flash
        (function () {
            var host = window.location.hostname;
            var sub  = host.split('.')[0];
            if (sub !== 'localhost' && !/^\d+\.\d+\./.test(host)) {
                fetch('/fortunett_technologies_/api/tenant/branding.php')
                    .then(function(r){ return r.json(); })
                    .then(function(b){
                        var root = document.documentElement;
                        root.style.setProperty('--brand',          b.brand_color);
                        root.style.setProperty('--brand-gradient', b.gradient);
                        var h = b.brand_color.replace('#','');
                        var rv = parseInt(h.substr(0,2),16);
                        var gv = parseInt(h.substr(2,2),16);
                        var bv = parseInt(h.substr(4,2),16);
                        root.style.setProperty('--brand-glow', 'rgba('+rv+','+gv+','+bv+',0.25)');
                        var h1 = document.querySelector('.auth-header h1');
                        if (h1) h1.textContent = b.company_name;
                        document.title = b.company_name + ' — Customer Login';
                    }).catch(function(){});
            }
        })();
    </script>
    <style>
        /* Navy defaults — matches FortuNett / super admin palette */
        :root {
            --brand:          #0f3460;
            --brand-glow:     rgba(15, 52, 96, 0.25);
            --brand-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        /* Tab toggle bar */
        .tab-bar {
            display: flex;
            gap: 6px;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: transparent;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: #fff;
            color: var(--brand);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Loading spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 24px 0;
        }
        .loading.show { display: block; }

        .spinner {
            border: 3px solid #e5e7eb;
            border-top-color: var(--brand);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 0.85s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p { font-size: 13px; color: #6b7280; }

        /* Register link row */
        .register-row {
            text-align: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #6b7280;
        }
        .register-row a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }
        .register-row a:hover { opacity: 0.75; }

        /* Support footer inside card body */
        .support-note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-icon-wrap">
                <i class="fas fa-wifi"></i>
            </div>
            <h1>FortuNett Technologies</h1>
            <p>Customer Self-Service Portal</p>
        </div>

        <div class="auth-body">
            <div id="alertBox" class="alert" style="display:none;"></div>

            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('credentials', this)">
                    <i class="fas fa-user"></i> Login
                </button>
                <button class="tab-btn" onclick="switchTab('voucher', this)">
                    <i class="fas fa-ticket-alt"></i> Voucher
                </button>
            </div>

            <div class="register-row">
                <a href="register.html"><i class="fas fa-user-plus"></i> New customer? Register here</a>
            </div>

            <!-- Credentials Login -->
            <div id="credentials-tab" class="tab-content active">
                <form id="credentialsForm" onsubmit="handleCredentialsLogin(event)">
                    <div class="form-group">
                        <label>Username / Phone / Email</label>
                        <input type="text" name="username" class="form-control-auth"
                               placeholder="Enter your username or phone" required autofocus>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <input type="password" name="password" id="password" class="form-control-auth"
                                   placeholder="Enter your password" required style="padding-right:44px;">
                            <i class="fas fa-eye password-toggle" onclick="togglePw('password', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Login to Internet</span>
                    </button>
                </form>
            </div>

            <!-- Voucher Login -->
            <div id="voucher-tab" class="tab-content">
                <form id="voucherForm" onsubmit="handleVoucherLogin(event)">
                    <div class="form-group">
                        <label>Voucher Code</label>
                        <input type="text" name="voucher" class="form-control-auth"
                               placeholder="Enter your voucher code" required>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-check-circle"></i>
                        <span>Activate Voucher</span>
                    </button>
                </form>
            </div>

            <div id="loadingBox" class="loading">
                <div class="spinner"></div>
                <p>Connecting…</p>
            </div>

            <div class="support-note">Need help? Contact support at <strong>+254729909387</strong></div>
        </div>
    </div>

    <script>
        // Resolve base path: /fortunett_technologies_ on localhost, '' on production
        const _base = (location.hostname === 'localhost' || /^\d+\.\d+\./.test(location.hostname))
            ? '/fortunett_technologies_' : '';
        const API_BASE = _base + '/api/customer';

        // Auto-login via token in URL
        window.addEventListener('DOMContentLoaded', () => {
            const token = new URLSearchParams(window.location.search).get('token');
            if (token) handleAutoLogin(token);
        });

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            hideAlert();
        }

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alertBox');
            box.className = 'alert alert-' + (type === 'error' ? 'danger' : 'success');
            box.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'exclamation-circle' : 'check-circle') + '"></i> <span>' + message + '</span>';
            box.style.display = 'flex';
        }

        function hideAlert() {
            const box = document.getElementById('alertBox');
            box.style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loadingBox').classList.add('show');
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        }

        function hideLoading() {
            document.getElementById('loadingBox').classList.remove('show');
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = '');
            // Re-show only the active tab
            document.querySelectorAll('.tab-content.active').forEach(el => el.style.display = 'block');
        }

        function togglePw(id, icon) {
            const inp = document.getElementById(id);
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
        }

        async function handleCredentialsLogin(e) {
            e.preventDefault();
            hideAlert();
            showLoading();
            try {
                const res  = await fetch(API_BASE + '/login.php', { method: 'POST', body: new FormData(e.target) });
                const data = await res.json();
                if (data.success) {
                    showAlert('Login successful! Connecting…', 'success');
                    setTimeout(() => { window.location.href = _base + '/customer/dashboard.php'; }, 1000);
                } else {
                    hideLoading();
                    showAlert(data.message || 'Login failed. Please check your credentials.');
                }
            } catch {
                hideLoading();
                showAlert('Connection error. Please try again.');
            }
        }

        async function handleVoucherLogin(e) {
            e.preventDefault();
            hideAlert();
            showLoading();
            try {
                const res  = await fetch(API_BASE + '/login.php', { method: 'POST', body: new FormData(e.target) });
                const data = await res.json();
                if (data.success) {
                    showAlert('Voucher activated! Connecting…', 'success');
                    setTimeout(() => { window.location.href = _base + '/customer/dashboard.php'; }, 1000);
                } else {
                    hideLoading();
                    showAlert(data.message || 'Invalid voucher code.');
                }
            } catch {
                hideLoading();
                showAlert('Connection error. Please try again.');
            }
        }

        async function handleAutoLogin(token) {
            showLoading();
            const isDemo = new URLSearchParams(window.location.search).get('demo') === '1';
            try {
                const fd = new FormData();
                fd.append('auto_login_token', token);
                const res  = await fetch(API_BASE + '/login.php', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    const msg = isDemo ? 'Demo session ready! Opening portal…' : 'Payment successful! Connecting…';
                    showAlert(msg, 'success');
                    const dest = _base + '/customer/dashboard.php' + (isDemo ? '?demo=1' : '');
                    setTimeout(() => { window.location.href = dest; }, 1000);
                } else {
                    hideLoading();
                    showAlert(data.message || 'Auto-login failed.');
                }
            } catch {
                hideLoading();
                showAlert('Connection error. Please try again.');
            }
        }
    </script>
</body>
</html>
